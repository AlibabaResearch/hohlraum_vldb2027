[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hohlraum-artifact"
version = "0.1.0"
description = "Hohlraum research implementation and evaluation framework"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["hohlraum*"]
exclude = ["third_party*"]
